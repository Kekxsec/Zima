name: Companion Release

on:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: zima-companion-arm64
            binary: zima-companion

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: zima-companion-x86_64-macos
            binary: zima-companion

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: zima-companion-linux-x86_64
            binary: zima-companion

          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            artifact: zima-companion-windows-x86_64.exe
            binary: zima-companion.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain (Linux → Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build release binary
        working-directory: companion
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy binary to dist
        shell: bash
        run: |
          mkdir -p dist
          cp companion/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.artifact }}

      # macOS codesign — only runs when APPLE_SIGNING_CERT secret is set
      - name: Codesign (macOS)
        if: >
          runner.os == 'macOS' &&
          secrets.APPLE_SIGNING_CERT != ''
        env:
          APPLE_SIGNING_CERT: ${{ secrets.APPLE_SIGNING_CERT }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "$APPLE_SIGNING_CERT" | base64 --decode > /tmp/signing_cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/signing_cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
          codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
