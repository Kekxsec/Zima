[project]
name = "zima"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "redis[hiredis]>=5.0.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "secure>=0.3.0",
    "resend>=2.0.0",
    "stripe>=9.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "types-PyYAML>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/dependencies.py" = ["B008"]
"backend/app/api/v1/*.py" = ["B008"]
"backend/app/db/migrations/versions/*.py" = ["E501"]
# core/exceptions.py uses Exception suffix intentionally (project convention overrides N818)
"backend/app/core/exceptions.py" = ["N818"]
# Scripts: suppress print (T20), annotation (ANN), security (S), and line-length (E501)
"scripts/*.py" = ["T20", "ANN", "S", "E501"]
# Provider implementations: pre-written code reviewed in Stage 4.
# E501/ANN204/ANN401: HTTP client methods have long signatures and JSON returns Any.
# E402/C408: import layout and dict literals fixed in Stage 4.
"backend/app/providers/**/*.py" = ["E501", "ANN204", "ANN202", "ANN401", "E402", "C408", "C401", "B020", "S104", "S110", "S112", "S324", "S603"]
# Tests: assert is the correct pattern (S101), annotations not required (ANN), E501 for long docstrings
"tests/**/*.py" = ["S101", "ANN", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
# Provider implementations are pre-written stubs reviewed in Stage 4.
module = ["backend.app.providers.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:sqlalchemy",
]
