[package]
name = "zima-companion"
version = "0.1.0"
edition = "2021"
authors = ["Zima"]
description = "Zima companion daemon — collects browser and device state"
license = "proprietary"

[[bin]]
name = "zima-companion"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config file
toml = "0.8"

# Directory paths
dirs = "5"

# OS keychain
keyring = "3"

# Crypto — SHA-256 for machine_id
sha2 = "0.10"
hex = "0.4"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
