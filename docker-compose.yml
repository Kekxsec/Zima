services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zima_dev
      POSTGRES_USER: zima
      POSTGRES_PASSWORD: zima_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zima -d zima_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: c6739e54eb3f7eefc5c9a85d09cd012559952976b41e1d0bba1870d1d0dbc2a9
      DATABASE_URL: postgresql+asyncpg://zima:zima_dev_password@postgres:5432/zima_dev
      DATABASE_URL_SYNC: postgresql+psycopg2://zima:zima_dev_password@postgres:5432/zima_dev
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: 3065d70d3547e137aeec93e4a306cfc30c166f74eaebdd242321cd7a8e06a1fb
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_BASE_URL: http://localhost:3000
      DEFAULT_TIER: core
      UV_LINK_MODE: copy
    command:
      - /bin/sh
      - -lc
      - |
        pip install --no-cache-dir uv &&
        uv sync --dev &&
        uv run alembic upgrade heads &&
        uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      # Browser-side: relative URL so requests stay on the same origin as the
      # frontend and benefit from the Next.js rewrite proxy (avoids cross-origin
      # cookie issues with SameSite=Lax).
      NEXT_PUBLIC_API_URL: /api/v1
      # Server-side (rewrites): internal Docker Compose service name
      INTERNAL_API_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    command:
      - /bin/sh
      - -lc
      - |
        npm install &&
        npm run dev -- --hostname 0.0.0.0 --port 3000
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  frontend_node_modules:
